<body>
<a class="skip-link" href="#main">К основному содержанию</a>
<header class="site-header">
  <a class="logo" href="../" aria-label="ann tim — на главную">
    <picture>
      <source type="image/webp"
              srcset="../assets/img/logo-100.webp 100w, ../assets/img/logo-200.webp 200w"
              sizes="(max-width: 860px) 50px, min(4.8vw, 92px)">
      <img src="../assets/img/logo.png" alt="ann tim" width="238" height="194"
           decoding="async">
    </picture>
  </a>

  <button class="nav-toggle" type="button" data-nav-toggle
          aria-expanded="false" aria-controls="nav" aria-label="Открыть меню"><span></span></button>

  <nav class="nav" id="nav" data-nav aria-label="Основное меню">
    <ul>
        <li><a href="../projects/" aria-current="page">ПРОЕКТЫ</a></li>

        <li><a href="../contacts/">КОНТАКТЫ</a></li>
    </ul>
  </nav>
</header>

<main class="projects-gallery" id="main" data-project-gallery>
  <h1 class="visually-hidden">Проекты</h1>

  <div class="project-tabs-wrap">
    <div class="project-tabs" data-project-tabs role="tablist" aria-label="Выберите проект"></div>
  </div>

  <section class="project-viewer" aria-labelledby="project-title">
    <header class="project-viewer__header">
      <h2 class="visually-hidden" id="project-title" data-project-title>OSTROV I</h2>
      <a class="project-viewer__more" data-project-link
         href="./ostrov-i/">Смотреть <span aria-hidden="true">→</span></a>
    </header>

    <div class="project-stage" data-project-stage tabindex="0"
         aria-label="Фотография проекта. Нажмите, чтобы открыть на весь экран; листайте свайпом или стрелками">
      <img class="project-stage__image is-active" data-project-image-layer
           src="../assets/img/projects/ostrov-realized-01/01.webp?v=2"
           alt="Проект OSTROV I, фотография 1 из 6"
           width="960" height="1280"
           loading="eager" fetchpriority="high" decoding="async">
      <img class="project-stage__image" data-project-image-layer
           alt="" aria-hidden="true" loading="eager" decoding="async">
      <span class="project-stage__loading" aria-hidden="true"></span>
    </div>

    <div class="project-viewer__controls">
      <button class="project-viewer__arrow" type="button" data-image-prev aria-label="Предыдущая фотография">
        <span aria-hidden="true">←</span>
      </button>
      <p class="project-viewer__counter" aria-live="polite">
        <span data-image-current>01</span><span aria-hidden="true"> / </span><span>06</span>
      </p>
      <button class="project-viewer__arrow" type="button" data-image-next aria-label="Следующая фотография">
        <span aria-hidden="true">→</span>
      </button>
      <button class="project-viewer__fullscreen" type="button" data-open-lightbox>
        <span class="project-viewer__fullscreen-label">На весь экран</span>
        <span aria-hidden="true">⛶</span>
      </button>
    </div>

    <div class="project-thumbs" data-project-thumbs role="tablist" aria-label="Фотографии выбранного проекта"></div>
  </section>
</main>

<div class="project-lightbox" data-project-lightbox role="dialog" aria-modal="true"
     aria-labelledby="lightbox-title" hidden>
  <header class="project-lightbox__header">
    <p class="project-lightbox__title" id="lightbox-title" data-lightbox-title>OSTROV I</p>
    <button class="project-lightbox__close" type="button" data-close-lightbox aria-label="Закрыть полноэкранный просмотр">
      <span aria-hidden="true"></span>
    </button>
  </header>
  <div class="project-lightbox__stage" data-lightbox-stage>
    <button class="project-lightbox__arrow project-lightbox__arrow--prev" type="button"
            data-lightbox-prev aria-label="Предыдущая фотография"><span aria-hidden="true">←</span></button>
    <div class="project-lightbox__media">
      <img class="project-lightbox__image" data-lightbox-image alt="" decoding="async">
    </div>
    <button class="project-lightbox__arrow project-lightbox__arrow--next" type="button"
            data-lightbox-next aria-label="Следующая фотография"><span aria-hidden="true">→</span></button>
  </div>
  <p class="project-lightbox__counter" aria-live="polite">
    <span data-lightbox-current>01</span><span aria-hidden="true"> / </span><span>06</span>
  </p>
</div>

<script src="../assets/js/main.js?v=6" defer></script>
<script src="../assets/js/projects.js?v=9" defer></script>
